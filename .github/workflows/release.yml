name: Release

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# One release at a time per branch.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/controller
    steps:
      - uses: actions/checkout@v6

      # Bumps the semver tag (main: v0.5.0, dev: v0.5.1-dev.<run>), builds and pushes the image.
      - name: Build and push image
        id: image
        uses: b-zago/actions/build-push-ghcr@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          imageName: controller

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install kubebuilder
        run: |
          curl -fsSL -o /tmp/kubebuilder https://github.com/kubernetes-sigs/kubebuilder/releases/download/v4.15.0/kubebuilder_linux_amd64
          sudo install /tmp/kubebuilder /usr/local/bin/kubebuilder

      # Regenerates dist/install.yaml (via make build-installer) and dist/chart with the new image.
      - name: Update installer and Helm chart
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          IMG="${IMAGE}:${TAG}" kubebuilder edit --plugins=helm/v2-alpha
          rm -f .github/workflows/test-chart.yml
          yq -i '.version = strenv(TAG) | .appVersion = strenv(TAG)' dist/chart/Chart.yaml
          yq -i '.manager.image.repository = strenv(IMAGE) | .manager.image.tag = strenv(TAG)' dist/chart/values.yaml

      - name: Push Helm chart to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: |
          echo "${TOKEN}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package dist/chart --destination /tmp/chart
          helm push /tmp/chart/*.tgz "${CHART_REPO}"

      # Commits to whichever branch triggered the run (main or dev).
      - name: Commit changes
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "release v${TAG}"
          git pull --rebase
          git push

      # Move the tag onto the release commit so v<TAG> contains that version's dist/.
      - name: Move tag to release commit
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          git tag -f "v${TAG}"
          git push -f origin "v${TAG}"
