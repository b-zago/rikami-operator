apiVersion: rikami.zagoapps.com/v1alpha1
kind: Profile
metadata:
  name: default
  namespace: dev
spec:
  # TODO(user): Add fields here
  gateway: dev-gateway
  pullPolicy: Always
  domain: pve.zagoapps.com
  externalSecretsConfig:
    refreshPolicy: CreatedOnce
    refreshInterval: 0s
    secretStoreRef:
      name: aws-ssm
      kind: ClusterSecretStore
  databaseConfig:
    appConfig:
      hostKey: host
      passwordKey: password
      usernameKey: username
      secretAppPath: /clusters/pgsql/dev/*/app
    migratorConfig:
      secretMigratorPath: /clusters/pgsql/dev/*/migrator
      secretKey: url
