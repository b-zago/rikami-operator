apiVersion: rikami.zagoapps.com/v1alpha1
kind: Vessel
metadata:
  name: simple-api
  namespace: dev
spec:
  # TODO(user): Add fields here
  servers:
    - image: ghcr.io/b-zago/simple-test-api/webserver:1.0.8
      port: 8000
      name: simple-api
      services:
        - name: simple-api
          port: 80
          image: nginx:alpine-slim
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
      externalSecrets:
        - name: simple-api
          data:
            - secretKey: SECRET1
              key: /clusters/dev/simple-api
              property: SECRET1
            - secretKey: SECRET2
              key: /clusters/dev/simple-api
              property: SECRET2
            - secretKey: ENV1
              key: /clusters/dev/simple-api
              property: SECRET2
            - secretKey: ENV2
              key: /clusters/dev/simple-api
              property: SECRET2
      databases:
        - name: simple-api
          schema: |
            CREATE TABLE IF NOT EXISTS scores (
              id SERIAL PRIMARY KEY,
              player VARCHAR(50),
              score INTEGER,
              created_at TIMESTAMP DEFAULT NOW()
            )
          seed: |
            INSERT INTO scores (player, score) VALUES
              ('alice', 1200),
              ('bob', 950),
              ('charlie', 1480),
              ('diana', 870),
              ('eve', 1320),
              ('alice', 1510),
              ('bob', 1100);
