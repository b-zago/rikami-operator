# An application. Uses the Profile named "default" in the same namespace.
apiVersion: rikami.zagoapps.com/v1alpha1
kind: Vessel
metadata:
  name: shop
spec:
  profile: default

  # Vessel-wide defaults: take these settings from the Profile unless a
  # workload says otherwise.
  useProfileProbes: true
  useProfileResources: true
  useProfileScheduling: true
  useProfileAutoscaling: true

  servers:
    # Public server: Deployment, Service, HPA and an HTTPRoute at
    # shop.apps.example.com.
    - name: shop-api
      image: ghcr.io/b-zago/simple-test-api/webserver:1.0.8
      port: 8000
      useProfileMetrics: true

      envs:
        LOG_LEVEL: info

      # Creates the ExternalSecret/Secret "shop-api-keys" and loads it as env vars.
      externalSecrets:
        - name: shop-api-keys
          data:
            - secretKey: PAYMENT_API_KEY
              key: /apps/example/shop
              property: payment_api_key

      # Creates credentials (db_host, db_username, db_password), an Atlas
      # schema migration and a one-off seed Job.
      databases:
        - name: shop
          schema: |
            CREATE TABLE IF NOT EXISTS orders (
              id SERIAL PRIMARY KEY,
              customer VARCHAR(100) NOT NULL,
              total_cents INTEGER NOT NULL,
              created_at TIMESTAMP DEFAULT NOW()
            );
          seed: |
            INSERT INTO orders (customer, total_cents) VALUES
              ('alice', 4200),
              ('bob', 1999);

      # In-cluster workload next to the server: Deployment and Service,
      # no HTTPRoute. Its name must differ from the server's.
      services:
        - name: shop-cache
          image: nginx:alpine-slim
          port: 80
          # Overrides for this workload only: nginx has no /ready or
          # /healthz, and a cache doesn't need to autoscale.
          useProfileProbes: false
          useProfileAutoscaling: false
          readinessProbe:
            tcpSocket:
              port: entry
            periodSeconds: 10
